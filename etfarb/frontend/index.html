<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETFarb 申赎套利看板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f6f8fb; color: #1f2937; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  .topbar { background: #fff; border-bottom: 1px solid #e5edf7; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .logo { font-size: 18px; font-weight: 700; color: #2563eb; }
  .logo span { color: #64748b; font-weight: 400; font-size: 13px; margin-left: 8px; }
  .meta { margin-left: auto; font-size: 13px; color: #64748b; }
  .fresh { padding: 2px 10px; border-radius: 999px; font-size: 12px; }
  .fresh.ok { background: #dcfce7; color: #16a34a; }
  .fresh.warn { background: #fef9c3; color: #d97706; }
  .fresh.err { background: #fee2e2; color: #dc2626; }
  .toolbar { padding: 10px 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tab { padding: 5px 14px; border-radius: 999px; border: 1px solid #dbeafe; background: #fff; color: #2563eb; cursor: pointer; font-size: 13px; }
  .tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .card { background: #fff; border-radius: 10px; margin: 0 20px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { background: #eef5ff; padding: 9px 10px; text-align: right; font-weight: 600; color: #374151; white-space: nowrap; cursor: pointer; position: sticky; top: 0; }
  thead th:first-child, thead th:nth-child(2), thead th:nth-child(3) { text-align: left; }
  tbody td { padding: 8px 10px; text-align: right; border-top: 1px solid #f1f5f9; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody td:first-child, tbody td:nth-child(2), tbody td:nth-child(3) { text-align: left; }
  tbody tr:hover { background: #f6faff; }
  tbody tr.iopv-row { cursor: pointer; }
  .code { font-family: Consolas, monospace; color: #2563eb; }
  .iopv { background: #f0f9ff; }
  .bias { background: #fefce8; }
  .up { color: #f44336; }
  .down { color: #4caf50; }
  .flat { color: #888; }
  .muted { color: #64748b; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .tag.red { background: #fee2e2; color: #dc2626; font-weight: 600; }
  .tag.green { background: #dcfce7; color: #16a34a; font-weight: 600; }
  .tag.gray { background: #f1f5f9; color: #64748b; }
  .tag.amber { background: #fef3c7; color: #d97706; font-weight: 600; }
  .empty { padding: 40px; text-align: center; color: #94a3b8; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; z-index: 9; }
  .logcard { padding: 0; }
  .loghead { padding: 10px 14px; background: #eef5ff; font-weight: 600; color: #374151; font-size: 13px; border-bottom: 1px solid #e5edf7; }
  .loghint { font-weight: 400; color: #94a3b8; font-size: 12px; }
  .logbox { height: 180px; overflow-y: auto; padding: 8px 14px; font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.7; }
  .logline { white-space: pre-wrap; word-break: break-all; }
  .logline .lt { color: #94a3b8; margin-right: 8px; }
  .logline.INFO { color: #475569; }
  .logline.SIGNAL { color: #dc2626; font-weight: 700; }
  .logline.WARN { color: #d97706; }
  .logline.ERROR { color: #b91c1c; font-weight: 600; }
  .recheck { color: #2563eb; text-decoration: none; font-size: 12px; }
  .recheck:hover { text-decoration: underline; }
  .hidden { display: none; }

  /* 历史弹窗头部静态信息 */
  .hist-head { display: flex; gap: 22px; flex-wrap: wrap; padding: 12px 16px; background: #f8fafc; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
  .hist-head .hi { color: #64748b; }
  .hist-head .hv { color: #1f2937; font-weight: 600; margin-left: 6px; }
  .btn { padding: 4px 12px; border-radius: 6px; border: 1px solid #dbeafe; background: #eff6ff; color: #2563eb; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #dbeafe; }

  /* ===== 顶层导航 + 跨境 ETF 看板（2026-09-17 立，仿集思录） ===== */
  .nav { display: flex; gap: 6px; padding: 10px 20px 0; }
  .nav button { padding: 7px 18px; border: 1px solid #e5edf7; border-radius: 8px 8px 0 0;
    background: #eef2f7; color: #64748b; cursor: pointer; font-size: 14px; font-weight: 600; }
  .nav button.active { background: #fff; color: #2563eb; border-color: #dbeafe; }
  .nav button:hover { color: #2563eb; }
  .view { display: none; }
  .view.active { display: block; }
  .mktwrap { margin: 0 20px 20px; background: #fff; border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; }
  .mktbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 9px 14px; border-bottom: 1px solid #eef2f7; font-size: 13px; color: #475569; }
  .mktbar input[type=text] { padding: 5px 10px; border: 1px solid #dbeafe; border-radius: 6px;
    font-size: 13px; width: 200px; outline: none; }
  .mktbar input[type=text]:focus { border-color: #93c5fd; }
  .mktbar .sp { margin-left: auto; color: #64748b; font-size: 12px; }
  .mktscroll { overflow: auto; max-height: 72vh; }
  table.mkt { border-collapse: separate; border-spacing: 0; font-size: 12px; width: max-content; min-width: 100%; }
  table.mkt thead th { position: sticky; top: 0; z-index: 2; background: #eef5ff; padding: 7px 8px;
    text-align: right; font-weight: 600; color: #374151; white-space: nowrap; cursor: pointer; user-select: none; }
  table.mkt thead th.l { text-align: left; }
  table.mkt thead th:hover { background: #e0ecff; }
  table.mkt thead th .ar { color: #94a3b8; font-size: 10px; margin-left: 2px; }
  table.mkt tbody td { padding: 6px 8px; text-align: right; border-top: 1px solid #f1f5f9;
    white-space: nowrap; font-variant-numeric: tabular-nums; color: #1f2937; }
  table.mkt tbody td.l { text-align: left; }
  table.mkt tbody tr:hover td { background: #f6faff; }
  /* 前两列冻结：s1 宽度固定，s2 的 left 依赖它 */
  table.mkt th.s1, table.mkt td.s1 { position: sticky; left: 0; z-index: 1;
    box-shadow: 1px 0 0 #eef2f7; background: #fff;
    width: 66px; min-width: 66px; max-width: 66px; }
  table.mkt th.s1 { background: #eef5ff; z-index: 3; }
  table.mkt th.s2, table.mkt td.s2 { position: sticky; left: 66px; z-index: 1;
    box-shadow: 1px 0 0 #eef2f7; background: #fff; min-width: 168px; }
  table.mkt th.s2 { background: #eef5ff; z-index: 3; }
  table.mkt tbody tr:hover td.s1, table.mkt tbody tr:hover td.s2 { background: #f6faff; }
  .mkt td.null, .mkt td.null * { color: #cbd5e1; }
  /* 换手率列豁免 null 灰：值由前端自算(volume_lot÷pre_share)，后端无 turnover 原始字段，
     渲染器会误加 null 类。有值时显示正常正文色，空值仍走 muted 灰「—」。 */
  .mkt td.turnover-cell, .mkt td.turnover-cell * { color: inherit; }
  .mkt td.turnover-cell .muted { color: #64748b; }
  /* 静态估值列：浅黄底色（对齐 LOF套利程序 col-static-val #fff7ed / 表头 #ffedd5） */
  table.mkt tbody td.col-static-val { background-color: #fff7ed !important; }
  table.mkt thead th.col-static-val { background-color: #ffedd5 !important; color: #1f2937; text-align: center; }
  table.mkt tbody tr:hover td.col-static-val { background-color: #ffedd5 !important; }
  .col-sub { display: block; font-size: 9px; color: #64748b; font-weight: 400; margin-top: 1px; line-height: 1.1; }
  .col-static-link { cursor: pointer; }
  .col-static-link:hover { text-decoration: underline; }
  .col-static-val { cursor: pointer; }          /* 整格可点（点任意位置看历史） */
  .col-static-val:hover { background: #eef5ff; }
  /* 商品期货(F) 驱动列：AG0 昨结算价 + SI 交叉验证（ETFarb 引用 LOFarb） */
  table.mkt tbody td.col-driver { background-color: #f0f9ff !important; }
  table.mkt thead th.col-driver { background-color: #dbeafe !important; color: #1f2937; text-align: center; }
  table.mkt tbody tr:hover td.col-driver { background-color: #dbeafe !important; }
  .col-driver-sub { display: block; font-size: 9px; color: #64748b; font-weight: 400; margin-top: 1px; line-height: 1.1; }
  .pcf-link { color: #2563eb; text-decoration: none; font-weight: 600; white-space: nowrap; }
  .pcf-link:hover { text-decoration: underline; }
  .warn-dot { color: #d97706; font-weight: 700; margin-left: 2px; cursor: help; }
  .mktbar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: #475569; }
  .tag.sm { padding: 1px 6px; font-size: 11px; }
  .woody-badge { display: inline-block; margin-left: 5px; padding: 1px 6px; font-size: 11px;
    line-height: 1.4; border-radius: 4px; background: #ecfeff; color: #0e7490;
    border: 1px solid #a5f3fc; font-weight: 600; vertical-align: middle;
    cursor: help; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">ETFarb<span>低风险投资</span></div>
  <div class="meta">
    更新 <span id="updated">--</span>
    <span class="fresh" id="fresh">--</span>
  </div>
</div>

<div class="nav" id="nav"></div>

<div class="toolbar" id="toolbar"></div>

<div id="mainView" class="view active">
<div class="card">
  <table>
    <div class="toolbar" id="mainToolbar" style="display:flex;gap:14px;align-items:center;padding:8px 12px;border-bottom:1px solid #eef2f7;">
      <label><input type="checkbox" id="mainWatch" onchange="mktOnlyWatch=this.checked;renderMainBoard();">仅看关注</label>
      <label><input type="checkbox" id="mainCompact" checked onchange="mktCompact=this.checked;renderMainBoard();">紧凑</label>
      <button class="btn" onclick="loadMainBoard(1)">刷新</button>
      <span class="sp" id="mainSp">—</span>
    </div>
    <div id="mainFxBar" style="padding:6px 12px;font-size:12px;color:#475569;background:#f8fafc;border-bottom:1px solid #eef2f7;"></div>
    <div class="mktscroll">
      <table class="mkt">
        <thead><tr id="mainHead"></tr></thead>
        <tbody id="mainBody"></tbody>
      </table>
    </div>
    <div class="empty" id="mainEmpty">切换到「测试看板」标签后自动加载…</div>
  </table>
  <div class="empty" id="empty">等待数据……（后端服务启动后自动刷新）</div>
</div>
</div>

<!-- 历史记录弹窗 -->
<div id="historyModal" class="hidden" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:100;">
  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:12px; width:94vw; max-width:1500px; max-height:88vh; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <div style="padding:16px 20px; border-bottom:1px solid #e5edf7; display:flex; align-items:center; gap:12px;">
      <div style="font-weight:700; font-size:16px;" id="historyTitle">历史记录</div>
      <div style="margin-left:auto; font-size:12px; color:#64748b;" id="historySub"></div>
      <button onclick="closeHistory()" style="margin-left:12px; padding:4px 12px; border:1px solid #e5edf7; border-radius:6px; cursor:pointer; background:#fff;">关闭</button>
    </div>
    <div style="padding:16px 20px; overflow-y:auto; overflow-x:auto; max-height:calc(88vh - 60px);">
      <div class="hist-head" id="histHead"></div>
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="background:#eef5ff;">
            <th style="padding:8px; text-align:left; border-bottom:1px solid #e5edf7;">日期</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">ETF收盘价</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">收盘IOPV</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;" title="(ETF收盘价 − 收盘IOPV) ÷ 收盘IOPV × 10000。两列同为 D 日收盘口径，故本列随「收盘IOPV」一起，在 D 日收盘前为空。">收盘折溢价(%)</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">净值Nav</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">现金差额</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">预估现金</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;" title="实际净值 = 官方净值Nav(D) × 买入结算汇兑(适用日 = D 的当日真实值，D 日盘后公布) ÷ FX中间价(D)。回看口径：反映该日实际发生的换汇成本。分母用官方Nav(D)——本行四个因子全是 D 日同一天，无跨日污染；测试看板因盘中拿不到 Nav(T)，改用当日 IOPV，且结算汇率只能取 T-1，故两页故意不同。需要该日 D+1 公告的官方净值，未发布则显「待接入」。">实际折溢价(T结算)%</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">FX-中间价</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;" title="适用日 = 本行日期 D 的当日真实结算汇兑比率（D 日盘后由上交所公布）。历史页是回看，故用当日真值；测试看板同名列用 T-1（当天盘中拿不到当日值）。">买入结算汇兑</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">计算篮子</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">官方篮子市值(替代金额)</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">最小申赎单位净值</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">误差(%)</th>
            <th style="padding:8px; text-align:center; border-bottom:1px solid #e5edf7;">状态</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- PCF 成分明细弹窗 -->
<div id="pcfModal" class="hidden" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:100;">
  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:12px; width:90vw; max-width:900px; max-height:85vh; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <div style="padding:16px 20px; border-bottom:1px solid #e5edf7; display:flex; align-items:center; gap:12px;">
      <div style="font-weight:700; font-size:16px;" id="pcfTitle">PCF 成分明细</div>
      <div style="margin-left:auto; font-size:12px; color:#64748b;" id="pcfSub"></div>
      <button onclick="closePcf()" style="margin-left:12px; padding:4px 12px; border:1px solid #e5edf7; border-radius:6px; cursor:pointer; background:#fff;">关闭</button>
    </div>
    <div style="padding:16px 20px; overflow-y:auto; max-height:calc(85vh - 60px);">
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="background:#eef5ff;">
            <th style="padding:8px; text-align:left; border-bottom:1px solid #e5edf7;">代码</th>
            <th style="padding:8px; text-align:left; border-bottom:1px solid #e5edf7;">名称</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">数量</th>
            <th style="padding:8px; text-align:center; border-bottom:1px solid #e5edf7;">替代标志</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">申购保证金率</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">申购替代金额</th>
            <th style="padding:8px; text-align:right; border-bottom:1px solid #e5edf7;">赎回替代金额</th>
            <th style="padding:8px; text-align:center; border-bottom:1px solid #e5edf7;">市场</th>
            <th style="padding:8px; text-align:center; border-bottom:1px solid #e5edf7;">备注</th>
          </tr>
        </thead>
        <tbody id="pcfBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 历史记录弹窗（点「静态估值」列弹出；UI 完全对齐 LOF 套利程序 arbTest Dashboard） -->
<div id="staticModal" class="hidden" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:100;">
  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:12px; width:96vw; max-width:1400px; height:90vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <div style="padding:14px 20px; border-bottom:1px solid #e5edf7; display:flex; align-items:center; gap:12px; flex-shrink:0;">
      <div style="font-weight:700; font-size:16px;" id="staticTitle">[历史记录]</div>
      <button onclick="closeStatic()" style="margin-left:auto; padding:4px 14px; border:1px solid #e5edf7; border-radius:6px; cursor:pointer; background:#fff;">关闭</button>
    </div>
    <div style="padding:12px 20px 0; flex-shrink:0;">
      <div id="histInfo" style="display:flex; flex-wrap:wrap; gap:18px; font-size:13px; color:#374151; margin-bottom:6px;"></div>
      <div id="staticDesc" style="font-size:12px; color:#64748b; margin-bottom:8px;"></div>
    </div>
    <div style="flex:1; overflow:auto; padding:0 20px;">
      <table style="width:100%; border-collapse:collapse; font-size:13px;" id="histTable">
        <thead id="staticHead"></thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
    <div style="padding:10px 20px; border-top:1px solid #e5edf7; display:flex; align-items:center; gap:8px; flex-shrink:0; font-size:13px;">
      <span id="histPageBar" style="display:flex; gap:4px; align-items:center;"></span>
      <span id="histPageInfo" style="margin-left:auto; color:#64748b;"></span>
      <select id="histSizeSel" onchange="histSetSize(this.value)" style="border:1px solid #e5edf7; border-radius:6px; padding:3px 6px;">
        <option>10</option><option>15</option><option>20</option><option>30</option>
      </select>
    </div>
  </div>
</div>

<!-- ===== 跨境 ETF 看板（欧美 / 亚洲，仿集思录） ===== -->
<div id="marketView" class="view">
  <div class="mktwrap">
    <div class="mktbar">
      <span id="mktTitle">低风险投资</span>
      <input type="text" id="mktSearch" placeholder="筛选 代码/名称/指数…"
             oninput="mktFilter=this.value.trim().toLowerCase();renderMarket();">
      <label><input type="checkbox" id="chkEtf" checked
             onchange="onTypeToggle();">显示ETF</label>
      <label><input type="checkbox" id="chkLof" checked
             onchange="onTypeToggle();">显示LOF</label>
      <label><input type="checkbox" id="chkWatch"
             onchange="mktOnlyWatch=this.checked;renderMarket();">仅看关注</label>
      <label><input type="checkbox" id="mktCompact" checked
             onchange="mktCompact=this.checked;renderMarket();">紧凑</label>
      <label><input type="checkbox" id="mktOnlyOut"
             onchange="mktOnlyOut=this.checked;renderMarket();">只看有IOPV</label>
      <button class="btn" onclick="loadMarket(MV,1)">刷新</button>
      <span class="sp" id="mktSp">—</span>
    </div>
    <div class="mktscroll">
      <table class="mkt">
        <thead><tr id="mktHead"></tr></thead>
        <tbody id="mktBody"></tbody>
      </table>
    </div>
    <div class="empty" id="mktEmpty">切换到跨境 ETF 标签后自动加载…</div>
  </div>
</div>

<div id="toast"></div>

<script>
var KINDS = ['全部', '国内宽基', '国内行业', '跨境QDII', '港股通'];   // 类型取后端 fund_iopv_config.kind
var currentKind = '全部';
var sortKey = 'premium_bps';
var sortDesc = true;
var lastData = [];
var lastLogs = [];

function fmt(v, p) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return Number(v).toFixed(p === undefined ? 2 : p);
}
function fmtBig(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return Number(v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtWan(v) { return (v && !isNaN(v)) ? (v / 10000).toFixed(0) + '万份' : '-'; }
function px(v) { return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat'); }
function sign(v) { return v > 0 ? '+' + fmt(v, 1) : fmt(v, 1); }
function pct(v, d) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  // 后端存 BP，转百分比显示
  return (v > 0 ? '+' : '') + fmt(v / 100, d === undefined ? 2 : d) + '%';
}
// 成分停牌徽标（标的层面，2026-09-17 立）
//   停牌券无成交价 ⇒ 交易所 IOPV 口径是「沿用停牌前收盘价」，我们照算、数字照常展示；
//   但停牌期间该部分只能走现金替代，且申赎替代款要等**复牌后按实际交易成本**结算
//   ⇒ 此刻的折溢价无法兑现，标出来提示不要参与（东哥：「凡是有停牌的 ETF 我都不去关心」）。
function suspBadge(r) {
  var codes = r.suspended_codes || [];
  var tip;
  if (codes.length) {
    tip = '成分含 ' + codes.length + ' 只停牌券（' + codes.join('、') + '）' +
      (r.suspended_weight != null ? '，占篮子货值 ' + (r.suspended_weight * 100).toFixed(2) + '%' : '') +
      '。IOPV 按「停牌前收盘价」估值（交易所官方口径，见 docs/21 §二·F），故数字照常展示；' +
      '但停牌期间这部分只能走现金替代，申赎替代款要等复牌后按实际交易成本结算 ⇒ 当前折溢价无法兑现。';
  } else if (r.suspended_from_db) {
    tip = (r.suspended_date ? '最近公告 ' + r.suspended_date + '：' : '') + r.suspended_from_db;
  } else {
    return '';
  }
  return '<span class="tag amber" style="margin-left:6px;" title="' +
    String(tip).replace(/"/g, '') + '">停牌中 · 暂停参考</span>';
}

function statusBadge(s) {
  if (s === 'OK') return '<span class="tag green">OK</span>';
  if (s === 'WARN') return '<span class="tag amber">WARN</span>';
  if (s === 'ERROR') return '<span class="tag red">ERROR</span>';
  if (s === 'CLOSED') return '<span class="tag gray">休市</span>';
  if (s === 'PENDING') return '<span class="tag gray">待校验</span>';
  return '<span class="tag gray">-</span>';
}

// FX-中间价/买入结算汇兑 移入页头（mainFxBar），状态降级为 mktBadge 徽标（停牌中/未出数）。
function renderMainBoard() {
  if (!mainData) return;
  // 关注池专属「标签」列（插在名称之后），并给单元格加备注 tooltip
  var COL_WATCH_TAG = { k: 'watch_tag', t: '标签', l: 1, f: function (v, r) {
      // 🔴 标签显示：服务端关注池标签优先；关注池没有、但被用户自选(localStorage)的，
      //    实时显示为「自选」（每次渲染重算，点星/取消星立即反映，不依赖重新加载）。
      var t = v || ((r.watched || isWatched(r.code)) ? '关注' : null);
      if (!t) return '<span class="muted">—</span>';
      var color = t === '重点' ? '#dc2626' : t === '观察' ? '#d97706'
                : t === '现金' ? '#0891b2' : t === '已弃' ? '#94a3b8'
                : t === '关注' ? '#f59e0b' : '#475569';
      return '<span title="' + esc(r.watch_note || '') + '" style="color:' + color +
             ';font-weight:600;cursor:help;">' + esc(t) + '</span>'; } };
  var base = (mktCompact ? COL_BASE : COL_BASE.concat(COL_EXTRA));
  var cols = base.slice(0, 2).concat([COL_WATCH_TAG], base.slice(2));
  var head = document.getElementById('mainHead');
  var body = document.getElementById('mainBody');
  var empty = document.getElementById('mainEmpty');
  var hh = '';
  cols.forEach(function (c) {
    var cls = (c.l ? 'l ' : '') + (c.cls || '');
    var ar = (mktSort.key === c.k) ? (mktSort.desc ? '▼' : '▲') : '';
    hh += '<th class="' + cls + '" data-k="' + c.k + '"' +
          (c.ttl ? ' title="' + esc(c.ttl) + '"' : '') + '>' + c.t +
          '<span class="ar">' + ar + '</span></th>';
  });
  head.innerHTML = hh;
  Array.prototype.forEach.call(head.querySelectorAll('th[data-k]'), function (h) {
    h.onclick = function () {
      var k = h.getAttribute('data-k');
      if (mktSort.key === k) { mktSort.desc = !mktSort.desc; }
      else { mktSort.key = k; mktSort.desc = true; }
      renderMainBoard();
    };
  });
  var rows = (mainData.rows || []).filter(function (r) {
    // 「我的关注」= 库关注(DB, r.watched) ∪ 浏览器自选(localStorage)；两者皆非立即隐藏
    if (!(r.watched || isWatched(r.code))) return false;
    if (mktOnlyWatch && !(r.watched || isWatched(r.code))) return false;
    if (mktFilter) {
      return ((r.code || '') + ' ' + (r.name || '') + ' ' + (r.index_nm || ''))
        .toLowerCase().indexOf(mktFilter) >= 0;
    }
    return true;
  });
  rows.sort(function (a, b) { return cmpRows(cols, a, b); });
  var html = '';
  rows.forEach(function (r) {
    html += '<tr>';
    cols.forEach(function (c) {
      var cls = (c.l ? 'l ' : '') + (c.cls || '');
      var raw = r[c.k];
      if (raw === null || raw === undefined) cls += ' null';
      var tdx = '';                        // 列级可选「整格可点」（static_val：点任意位置看历史）
      if (c.tdc) { var s = c.tdc(r); if (s) tdx = ' style="cursor:pointer;" onclick="' + s + '"'; }
      html += '<td class="' + cls + '"' + tdx + '>' + (c.f ? c.f(raw, r) : esc(raw)) + '</td>';
    });
    html += '</tr>';
  });
  body.innerHTML = html;
  empty.style.display = rows.length ? 'none' : 'block';
  if (!rows.length) empty.textContent = '没有匹配的标的';
  // 统计条
  var st = mainData.stats || {};
  var out = (st.perstock || 0) + (st.proxy || 0) + (st.lof || 0);
  var sp = document.getElementById('mainSp');
  if (sp) sp.textContent = '共 ' + (mainData.count || 0) + ' 只 · 出数 ' + out +
    ' · 自算vs官方中位 ' + (st.err_bps_median === null || st.err_bps_median === undefined
      ? '—' : (st.err_bps_median > 0 ? '+' : '') + Number(st.err_bps_median).toFixed(1) + 'bp') +
    ' · 更新 ' + (mainData.ts || '');
  var upm = document.getElementById('updated'); if (upm) upm.textContent = mainData.ts || '--';
  var frm = document.getElementById('fresh'); if (frm) { frm.className = 'fresh ok'; frm.textContent = '实时'; }
  // FX 页头条（HKD 口径，取任一有值行；同币种全市场通用，故只显示一处）
  var fx = null;
  (mainData.rows || []).forEach(function (r) {
    if (fx === null && r.fx_mid != null && r.settle_fx != null) fx = r;
  });
  var fb = document.getElementById('mainFxBar');
  if (fb) {
    fb.innerHTML = fx ? ('汇率（HKD 口径）｜FX-中间价 <b>' + nf(fx.fx_mid, 4) +
      '</b> · 买入结算汇兑 <b>' + nf(fx.settle_fx, 4) + '</b>' +

      '　·　FX-中间价/买入结算汇兑已移至页头（同币种全市场通用，不再逐行重复）')
      : '汇率数据待接入（非交易时段）';

}

// ============ PCF 成分明细弹窗 ============
function showPcf(code) {
  fetch('/api/pcf/' + code, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error || !d.components || !d.components.length) {
        alert('暂无 PCF 明细：' + (d.error || '无成分'));
        return;
      }
      var r = lastData.find(function (x) { return x.code === code; });
      document.getElementById('pcfTitle').textContent = code + ' ' + (r ? (r.name || '') : '') + ' PCF 成分明细';
      var src = d.snapshot.source || '';
      var srcHtml = /^https?:/i.test(src)
        ? ' ｜ <a href="' + src + '" target="_blank" style="color:#2563eb; text-decoration:none;">源文件↗</a>'
        : (src ? ' ｜ 来源 ' + src : '');
      document.getElementById('pcfSub').innerHTML = d.snapshot
        ? ('公告 ' + (d.components_trade_date || d.snapshot.trade_date) + ' ｜ 成分 ' + d.components.length + ' 只' +
           ' ｜ 单位净值 ' + fmt(d.snapshot.unit_nav, 4) +
           ' ｜ 现金差额 ' + fmt(d.snapshot.cash_diff, 2) + ' ｜ 预估现金 ' + fmt(d.snapshot.est_cash_part, 2) +
           (d.fallback ? ' ｜ <span style="color:#dc2626;">最新公告 ' + d.latest_trade_date + ' 成分尚未落库，已回退展示</span>' : '') +
           srcHtml)
        : '';
      var body = document.getElementById('pcfBody');
      body.innerHTML = '';
      var flagText = {0: '禁止', 1: '允许', 2: '必须', 3: '必须退补'};
      d.components.forEach(function (c) {
        var tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid #f1f5f9';
        var memo = [];
        if (c.is_virtual) memo.push('虚拟现金');
        if (c.is_cross_market && !c.is_virtual) memo.push('跨市场');
        // 🔴 「必须现金替代」成分：数量=0、货值在 cash_value（深市『申购替代金额』列）。
        //    它**属于篮子货值**，会被计入 IOPV —— 标出来，免得看到「数量 0」以为它不参与。
        if (c.cash_value > 0) memo.push('必须现金替代·货值计入篮子');
        var sharesCell = (c.cash_value > 0)
          ? '<span class="tag sm">现金替代</span>'
          : (c.shares != null ? c.shares : '-');
        var buyCell = (c.subst_amount != null)
          ? c.subst_amount.toFixed(2)
          : (c.cash_value != null ? c.cash_value.toFixed(2) : '-');
        tr.innerHTML =
          '<td style="padding:8px; text-align:left; font-family:Consolas,monospace; color:#2563eb;">' + (c.stock_code || '-') + '</td>' +
          '<td style="padding:8px; text-align:left;">' + (c.name || '-') + '</td>' +
          '<td style="padding:8px; text-align:right;">' + sharesCell + '</td>' +
          '<td style="padding:8px; text-align:center;">' + (flagText[c.cash_sub_flag] || c.cash_sub_flag || '-') + '</td>' +
          '<td style="padding:8px; text-align:right;">' + (c.premium_ratio != null ? (c.premium_ratio * 100).toFixed(2) + '%' : '-') + '</td>' +
          '<td style="padding:8px; text-align:right;">' + buyCell + '</td>' +
          '<td style="padding:8px; text-align:right;">' + (c.redemption_subst_amount != null ? c.redemption_subst_amount.toFixed(2) : '-') + '</td>' +
          '<td style="padding:8px; text-align:center;">' + (c.market || '-') + '</td>' +
          '<td style="padding:8px; text-align:center; color:#64748b;">' + (memo.join(' / ') || '-') + '</td>';
        body.appendChild(tr);
      });
      document.getElementById('pcfModal').classList.remove('hidden');
    })
    .catch(function (e) { alert('获取 PCF 失败: ' + e.message); });
}

function switchView(k) {
  currentView = (k === 'main') ? 'main' : 'market';

    var cw = document.getElementById('mainCompact');
    if (cw) cw.checked = mktCompact;

    // 🔴 自选合并：切到「我的关注」时，若自选列表变了（点了星）或首次，重抓并集数据；

  } else {

            : (MV === 'A') ? '亚洲市场（ETF + QDII亚洲LOF 混合）'

  var key = mkt + '|' + (mktType || '');
  fetch('/api/etf_market?market=' + mkt + (force ? '&force=1' : '') + type, { cache: 'no-store' })

  var isLof = (MV === 'L' || MV === 'C' || MV === 'G' || MV === 'F');
  // 商品期货(F) 专属「驱动列」：AG0 昨结算价（+ SI 交叉验证）。仅 F 市场注入。
  var F_DRIVER_COL = { k: 'ag0_settlement', t: '驱动<br><span class="col-sub">AG0昨结算</span>', ttl: '上期所白银期货 AG0 上一交易日官方结算价（元/千克）。估值分母，由 LOFarb SSE 推流/新浪 nf_AG0 双源提供，ETFarb 引用不重算。盘中非交易时段实时价丢弃、昨结算价恒显示（东哥要求）。', cls: 'col-driver', f: function (v, r) {
      if (v === null || v === undefined) return '<span class="muted">—</span>';
      var si = r.si_val;
      var siTxt = (si === null || si === undefined) ? '' : (' / SI ' + nf(si, 4));
      return nf(v, 1) + '<span class="col-driver-sub">' + siTxt + '</span>';
  } };
  var cols = (mktCompact ? (isLof ? COL_LOF_BASE : COL_BASE)
                         : (isLof ? COL_LOF_BASE.concat(COL_EXTRA) : COL_BASE.concat(COL_EXTRA)));
  // 东哥 2026-10-08：黄金原油删「净值涨幅」列（没啥用）。国内LOF/现金管理保留。
  if (MV === 'G') cols = cols.filter(function (c) { return c.k !== 'nav_chg_pct'; });
  // 商品期货(F)：在「指数涨幅」列后插入驱动列。
  if (MV === 'F') {
    var _idx = -1;
    for (var _ci = 0; _ci < cols.length; _ci++) if (cols[_ci].k === 'idx_chg') { _idx = _ci; break; }
    cols.splice(_idx >= 0 ? _idx + 1 : cols.length, 0, F_DRIVER_COL);
  }
  // 名称统一（东哥 10-05 拍板）：基金公司发布的叫净值——QDII欧美=T-2 净值、亚洲(日本/港股通)=T-1 净值；
  //   我们自算的叫「T-1 静态估值」。主看板(全市场混合)与国内LOF/现金管理不带前缀。
  if (!isLof) {
    var _navT = (MV === 'E') ? 'T-2 净值' : 'T-1 净值';
    for (var _i = 0; _i < cols.length; _i++) if (cols[_i].k === 'nav') cols[_i].t = _navT;
  }
  var head = document.getElementById('mktHead');
  var body = document.getElementById('mktBody');
  var empty = document.getElementById('mktEmpty');

  var hh = '';
  cols.forEach(function (c) {
    var cls = (c.l ? 'l ' : '') + (c.cls || '');
    var ar = (mktSort.key === c.k) ? (mktSort.desc ? '▼' : '▲') : '';
    hh += '<th class="' + cls + '" data-k="' + c.k + '"' +
          (c.ttl ? ' title="' + esc(c.ttl) + '"' : '') + '>' + c.t +
          '<span class="ar">' + ar + '</span></th>';
  });
  head.innerHTML = hh;
  Array.prototype.forEach.call(head.querySelectorAll('th[data-k]'), function (h) {
    h.onclick = function () {
      var k = h.getAttribute('data-k');
      if (mktSort.key === k) { mktSort.desc = !mktSort.desc; }
      else { mktSort.key = k; mktSort.desc = true; }
      renderMarket();
    };
  });

  var sp = document.getElementById('mktSp');
  if (!d) {
    body.innerHTML = '<tr><td colspan="' + cols.length +
      '" style="text-align:center;padding:26px;color:#94a3b8;">加载中…</td></tr>';
    empty.style.display = 'none';
    return;
  }
  var rows = (d.rows || []).filter(function (r) {
    if (mktOnlyWatch && !(r.watched || isWatched(r.code))) return false;
    if (mktOnlyOut && r.iopv === null) return false;
    if (!mktFilter) return true;
    return ((r.code || '') + ' ' + (r.name || '') + ' ' + (r.index_nm || ''))
      .toLowerCase().indexOf(mktFilter) >= 0;
  });
  rows.sort(function (a, b) { return cmpRows(cols, a, b); });

  var html = '';
  rows.forEach(function (r) {
    html += '<tr>';
    cols.forEach(function (c) {
      var cls = (c.l ? 'l ' : '') + (c.cls || '');
      var raw = r[c.k];
      if (raw === null || raw === undefined) cls += ' null';
      var tdx = '';                        // 列级可选「整格可点」（static_val：点任意位置看历史）
      if (c.tdc) { var s = c.tdc(r); if (s) tdx = ' style="cursor:pointer;" onclick="' + s + '"'; }
      html += '<td class="' + cls + '"' + tdx + '>' + (c.f ? c.f(raw, r) : esc(raw)) + '</td>';
    });
    html += '</tr>';
  });
  body.innerHTML = html;
  empty.style.display = rows.length ? 'none' : 'block';
  if (!rows.length) empty.textContent = '没有匹配的标的';

  var st = d.stats || {};
  var out = (st.perstock || 0) + (st.proxy || 0) + (st.lof || 0);
  sp.textContent = '共 ' + (d.count || 0) + ' 只 · 出数 ' + out +
    ' · 未出 ' + ((st.no_source || 0) + (st.frozen || 0) + (st.err || 0) + (st.lof_missing || 0)) +
    ' · 自算vs官方中位 ' +
    (st.err_bps_median === null || st.err_bps_median === undefined
      ? '—' : (st.err_bps_median > 0 ? '+' : '') + Number(st.err_bps_median).toFixed(1) + 'bp') +
    ' · 更新 ' + (d.ts || '');
}

document.querySelectorAll('th[data-k]').forEach(function (th) {
  th.onclick = function () {
    var k = th.getAttribute('data-k');
    if (sortKey === k) { sortDesc = !sortDesc; } else { sortKey = k; sortDesc = true; }
    renderMarket();
  };
});

renderTabs();
renderNav();
refresh();
setInterval(function () {
  if (currentView === 'main') { refresh(); }
}, 3000);
// 跨境看板：30 秒自动刷新（后端同口径 30 秒缓存，见 docs/40 §4.4）
setInterval(function () {
  if (currentView === 'market') { loadMarket(MV); }
}, 30000);
</script>
</body>
</html>
